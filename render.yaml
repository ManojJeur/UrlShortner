databases:
  - name: urlshortener-db
    plan: free
    databaseName: urlshortener
    user: urlshortener
    ipAllowList: []

services:
  - type: web
    name: urlshortener-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render

      - key: SERVER_PORT
        value: 10000

      - key: APP_BASE_URL
        fromService:
          type: web
          name: urlshortener-api
          envVarKey: RENDER_EXTERNAL_URL

      - key: DB_URL
        fromDatabase:
          name: urlshortener-db
          property: connectionString

      - key: DB_USERNAME
        fromDatabase:
          name: urlshortener-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: urlshortener-db
          property: password

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: urlshortener-cache
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: APP_AI_ENABLED
        value: false

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: GROQ_TEMPERATURE
        value: 0.3

      - key: GROQ_MAX_TOKENS
        value: 1200

  - type: keyvalue
    name: urlshortener-cache
    plan: free
    ipAllowList: []
