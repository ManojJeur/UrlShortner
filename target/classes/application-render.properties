# Render is the deployed profile. Require an operator supplied secret rather than
# allowing the local development key to sign production tokens.
app.jwt.secret=${JWT_SECRET}

# Keep interactive API documentation and detailed health diagnostics private in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

# Avoid SQL statement formatting overhead and keep Hibernate validation as the only schema action.
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
