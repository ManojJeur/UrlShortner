spring.application.name=urlshortener

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=jdbc:${DB_URL:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DB_USERNAME:urlshortener}
spring.datasource.password=${DB_PASSWORD:urlshortener}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
spring.jackson.time-zone=UTC
server.port=${PORT:${SERVER_PORT:10000}}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.compression.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=true
app.timezone=UTC
app.api-base-path=/api/v1
app.short-url.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-url.code-length=${SHORT_URL_CODE_LENGTH:7}
app.short-url.generation-attempts=${SHORT_URL_GENERATION_ATTEMPTS:10}
app.ai.enabled=${APP_AI_ENABLED:false}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
# This service uses chat only; leave optional OpenAI models disabled so they do not require an API key.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=${GROQ_TEMPERATURE:0.3}
spring.ai.openai.chat.options.max-tokens=${GROQ_MAX_TOKENS:1200}
app.jwt.secret=${JWT_SECRET:local-only-change-this-secret-before-deploying-1234567890}
app.jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS:900}
app.jwt.refresh-token-seconds=${JWT_REFRESH_TOKEN_SECONDS:1209600}
app.maintenance.refresh-token-cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}
