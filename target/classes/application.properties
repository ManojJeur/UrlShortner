spring.application.name=urlshortener

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urlshortener}
spring.datasource.username=${DB_USERNAME:urlshortener}
spring.datasource.password=${DB_PASSWORD:urlshortener}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.jackson.time-zone=UTC
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
app.timezone=UTC
app.api-base-path=/api/v1
app.short-url.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-url.code-length=${SHORT_URL_CODE_LENGTH:7}
app.short-url.generation-attempts=${SHORT_URL_GENERATION_ATTEMPTS:10}
app.ai.enabled=${APP_AI_ENABLED:false}
app.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
app.jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS:900}
app.jwt.refresh-token-seconds=${JWT_REFRESH_TOKEN_SECONDS:1209600}
app.maintenance.refresh-token-cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}
